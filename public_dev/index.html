<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - SINPRF-ES (V2)</title>
    <script src="js/path-resolver.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Ajuste fino para a home */
        .hero-v2 { background-image: url('img/hero_prf.jpg'); }
    </style>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="site-header"></div>

    <main>
        <section class="hero-v2" id="cms-hero">
            <div class="hero-v2-content">
                <h1 id="hero-title">SINPRF-ES</h1>
                <p id="hero-body">Sindicato dos Policiais Rodoviários Federais no Estado do Espírito Santo.</p>
                <div class="btn-row">
                    <a href="javascript:PathResolver.navigate('noticias.html')" class="btn btn-primary">Ver Notícias</a>
                    <a href="javascript:PathResolver.navigate('contato.html')" class="btn btn-outline" style="color:white; border-color:white;">Fale Conosco</a>
                </div>
            </div>
        </section>

        <section class="cms-page-section">
            <div class="cms-container">
                <h2 class="section-title text-center" style="margin-bottom: 40px; color: #003366;">Destaques</h2>
                <div id="content-blocks" class="cards-grid-v2">
                    <!-- Blocos dinâmicos -->
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/cms.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.CMS) window.CMS.loadPage('home');
        });
    </script>
</body>
</html>
