# Railway configuration for API service
[build]
builder = "nixpacks"
buildCommand = "npm i -g pnpm@9.15.9 && pnpm -v && pnpm install --frozen-lockfile && pnpm --filter @sinprfes/backend run build"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
restartPolicyType = "on_failure"
