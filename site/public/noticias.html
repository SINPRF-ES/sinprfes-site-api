<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="/config.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#003366" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SINPRF-ES" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Notícias – SINPRF-ES</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/ui-canon.css" />
  <link rel="stylesheet" href="/css/components/instagram-feed.css" />
  <link rel="icon" type="image/png" href="/img/placeholder-sinprf.png" />
  <script src="/js/utils.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js" defer></script>
  <script src="/js/informes-renderer.js" defer></script>
  <script src="/js/noticias-site.js" defer></script>
</head>

<body>
  <!-- Header padrão (injetado via main.js) -->
  <div id="site-header"></div>

  <main class="page container ui-container public-page" style="margin-top: var(--ui-space-5);">
    <h1 style="color: var(--ui-primary);">Notícias</h1>

    <section class="ui-card news-source-tabs" aria-label="Fontes de conteúdo de notícias">
      <div class="news-source-tabs__controls" role="tablist" aria-label="Selecionar fonte">
        <button class="ui-button ui-button-outline news-tab-button is-active" role="tab" aria-selected="true" aria-controls="news-panel-instagram" id="news-tab-instagram" data-news-tab="instagram">Instagram</button>
        <button class="ui-button ui-button-outline news-tab-button" role="tab" aria-selected="false" aria-controls="news-panel-cms" id="news-tab-cms" data-news-tab="cms">Notícias do site (CMS)</button>
      </div>
      <p class="section-subtitle" style="margin: 12px 0 0;">As publicações do Instagram oficial e as notícias editoriais do site convivem aqui, com origem identificada.</p>
    </section>

    <section id="news-panel-instagram" class="news-source-panel" role="tabpanel" aria-labelledby="news-tab-instagram">
      <div id="instagram-news-root"></div>
    </section>

    <section id="news-panel-cms" class="news-source-panel is-hidden" role="tabpanel" aria-labelledby="news-tab-cms">
      <div id="cms-news-root"></div>
    </section>
  </main>

  <!-- Rodapé padrão (injetado via main.js) -->
  <div id="site-footer"></div>
</body>
</html>
