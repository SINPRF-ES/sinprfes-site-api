<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <script src="/config.js"></script>
  <title>Redefinir senha – SINPRF-ES</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#003366" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SINPRF-ES" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/main.js" defer></script>
  <script src="/js/redefinir-senha.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page container">
    <section class="card login-card">
      <h1>Redefinir senha</h1>
      <p class="page-intro">
        Defina uma nova senha para sua Página Inicial.
      </p>

      <form id="reset-form" class="form-grid">
        <div class="form-group form-group-full">
          <label for="senha-nova">Nova senha</label>
          <input
            type="password"
            id="senha-nova"
            name="senha_nova"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group form-group-full">
          <label for="senha-confirma">Confirme a nova senha</label>
          <input
            type="password"
            id="senha-confirma"
            name="senha_confirma"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            Salvar nova senha
          </button>
        </div>
      </form>

      <p id="reset-mensagem" class="field-hint"></p>

      <p class="field-hint">
        Se este link estiver expirado ou inválido, volte à página de login
        e utilize a opção "Esqueci minha senha" novamente.
      </p>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
