<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <script src="/config.js"></script>
  <title>Redefinir senha – SINPRF-ES</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#003366" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SINPRF-ES" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/ui-canon.css" />
  <script src="/js/utils.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/redefinir-senha.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page ui-container" style="margin-top: var(--ui-space-5); margin-bottom: var(--ui-space-5); display: flex; justify-content: center;">
    <section class="ui-card login-card" style="max-width: 500px; width: 100%;">
      <h1 style="text-align: center; color: var(--ui-primary); margin-top: 0;">Redefinir senha</h1>
      <p class="page-intro" style="color: var(--ui-text-muted); margin-bottom: var(--ui-space-4); text-align: center;">
        Defina uma nova senha para sua Página Inicial.
      </p>

      <form id="reset-form" class="ui-stack">
        <div class="ui-form-group">
          <label for="senha-nova" class="ui-label">Nova senha <span class="ui-text-danger" aria-hidden="true">*</span></label>
          <input
            type="password"
            id="senha-nova"
            name="senha_nova"
            class="ui-input"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="ui-form-group">
          <label for="senha-confirma" class="ui-label">Confirme a nova senha <span class="ui-text-danger" aria-hidden="true">*</span></label>
          <input
            type="password"
            id="senha-confirma"
            name="senha_confirma"
            class="ui-input"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-actions">
          <button type="submit" class="ui-button ui-button-secondary" style="width: 100%;">
            Salvar nova senha
          </button>
        </div>
      </form>

      <div id="reset-mensagem" role="status" aria-live="polite" style="display: none; margin-top: var(--ui-space-3);"></div>

      <p class="field-hint" style="color: var(--ui-text-muted); margin-top: var(--ui-space-4);">
        Se este link estiver expirado ou inválido, volte à página de login
        e utilize a opção "Esqueci minha senha" novamente.
      </p>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
