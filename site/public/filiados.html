<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8" />
  <script src="/config.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#003366" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SINPRF-ES" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>SINPRF-ES</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/png" href="/img/placeholder-sinprf.png" />

</head>
<body>
  <div id="site-header"></div>

  <div class="container">
    <main class="page-content" id="filiados">

      <section class="card">
        <h2 class="section-title">
          <span class="emoji">🧾</span>
          <span>Filiados ao SINPRF-ES</span>
        </h2>
        <p class="section-subtitle">
          Consulta básica dos filiados cadastrados no sistema do sindicato.
        </p>

        <div class="section-box" style="margin-bottom: 12px;">
          <form id="filtro-filiados" onsubmit="return false;">
            <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;">
              <div style="flex:1 1 220px; min-width:0;">
                <label for="busca-nome" style="font-size:11px; color:var(--texto-fraco); display:block; margin-bottom:2px;">
                  Buscar por nome / e-mail
                </label>
                <input
                  type="text"
                  id="busca-nome"
                  placeholder="Digite parte do nome ou e-mail"
                  style="width:100%; padding:6px 8px; border-radius:10px; border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.4); color:var(--texto-claro); font-size:13px;"
                >
              </div>

              <div style="flex:0 0 150px;">
                <label for="filtro-situacao" style="font-size:11px; color:var(--texto-fraco); display:block; margin-bottom:2px;">
                  Situação
                </label>
                <select
                  id="filtro-situacao"
                  style="width:100%; padding:6px 8px; border-radius:10px; border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.4); color:var(--texto-claro); font-size:13px;"
                >
                  <option value="">Todas</option>
                  <option value="Ativo">Ativo</option>
                  <option value="Veterano">Veterano</option>
                </select>
              </div>

              <div style="flex:0 0 auto;">
                <button class="btn btn-primary" id="btn-aplicar-filtro" type="button">
                  Buscar
                </button>
              </div>
            </div>
          </form>
        </div>

        <div class="section-box" style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; font-size:12px;">
            <thead>
              <tr style="border-bottom:1px solid rgba(255,255,255,0.12);">
                <th style="text-align:left; padding:6px 4px;">Nome</th>
                <th style="text-align:left; padding:6px 4px;">Situação</th>
                <th style="text-align:left; padding:6px 4px;">Telefone</th>
                <th style="text-align:left; padding:6px 4px;">E-mail</th>
                <th style="text-align:left; padding:6px 4px;">Endereço</th>
              </tr>
            </thead>
            <tbody id="tabela-filiados">
              <tr>
                <td colspan="5" style="padding:8px 4px; text-align:center; color:var(--texto-fraco);">
                  Carregando dados...
                </td>
              </tr>
            </tbody>
          </table>
          <div id="info-filiados" style="margin-top:6px; font-size:11px; color:var(--texto-fraco);"></div>
        </div>
      </section>

      <script>
        function escapeHTML(str) {
          if (!str) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function carregarFiliados() {
          const q = document.getElementById('busca-nome').value.trim();
          const situacao = document.getElementById('filtro-situacao').value;

          const params = new URLSearchParams();
          if (q) params.append('q', q);
          if (situacao) params.append('situacao', situacao);

          const url = '/api/filiados' + (params.toString() ? '?' + params.toString() : '');

          const tbody = document.getElementById('tabela-filiados');
          const info  = document.getElementById('info-filiados');

          tbody.innerHTML = '<tr><td colspan="5" style="padding:8px 4px; text-align:center; color:var(--texto-fraco);">Carregando ...</td></tr>';
          info.textContent = '';

          fetch(url)
            .then(resp => resp.json())
            .then(data => {
              if (!data.ok) {
                tbody.innerHTML = '<tr><td colspan="5" style="padding:8px 4px; text-align:center; color:#ff7675;">Erro ao carregar dados.</td></tr>';
                return;
              }

              if (!data.results || data.results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="padding:8px 4px; text-align:center; color:var(--texto-fraco);">Nenhum filiado encontrado com os filtros informados.</td></tr>';
                info.textContent = '';
                return;
              }

              tbody.innerHTML = data.results.map(f => {
                const telefone = f.telefone1 || f.telefone2 || '';
                const email = f.email1 || f.email2 || '';
                const endereco = f.endereco || '';

                return '<tr>' +
                  '<td style="padding:6px 4px; white-space:nowrap;">' + escapeHTML(f.nome || '') + '</td>' +
                  '<td style="padding:6px 4px;">' + escapeHTML(f.situacao || '') + '</td>' +
                  '<td style="padding:6px 4px; white-space:nowrap;">' + escapeHTML(telefone) + '</td>' +
                  '<td style="padding:6px 4px; white-space:nowrap;">' + escapeHTML(email) + '</td>' +
                  '<td style="padding:6px 4px;">' + escapeHTML(endereco) + '</td>' +
                  '</tr>';
              }).join('');

              info.textContent = 'Total de registros exibidos: ' + data.results.length;
            })
            .catch(err => {
              console.error(err);
              tbody.innerHTML = '<tr><td colspan="5" style="padding:8px 4px; text-align:center; color:#ff7675;">Erro de comunicação com o servidor.</td></tr>';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('btn-aplicar-filtro').addEventListener('click', carregarFiliados);
          document.getElementById('busca-nome').addEventListener('keyup', ev => {
            if (ev.key === 'Enter') carregarFiliados();
          });

          carregarFiliados();
        });
      </script>

    </main>
  </div>

  <div id="site-footer"></div>

  <script src="/js/main.js" defer></script>
</body>
</html>
