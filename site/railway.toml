# Railway configuration for SITE service
[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm --filter @sinprfes/site run build && mkdir -p public/shared && cp -R ../shared/* public/shared/ || true"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
restartPolicyType = "on_failure"

[env]
PORT = "8080"
