# Railway configuration for SITE service
[build]
builder = "nixpacks"
# Instalamos dependências e copiamos os arquivos do monorepo /shared para dentro de public/shared
# Isso garante que o site seja auto-contido para o runtime do Railway.
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @sinprfes/site run build && mkdir -p public/shared && cp -R ../shared/* public/shared/"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
restartPolicyType = "on_failure"

[env]
PORT = "8080"
