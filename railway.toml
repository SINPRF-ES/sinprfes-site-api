# Railway configuration for API service (repo root)
[build]
builder = "nixpacks"
buildCommand = "npm exec -y pnpm@9.15.9 -- -v && npm exec -y pnpm@9.15.9 -- install --frozen-lockfile && npm exec -y pnpm@9.15.9 -- --filter @sinprfes/backend run build"

[deploy]
startCommand = "node backend/server.js"
healthcheckPath = "/health"
restartPolicyType = "on_failure"

[env]
PORT = "8080"
