<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Página Inicial – FENAPRF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/main.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page container" style="max-width: 500px; margin-top: 40px;">
    <section class="card login-card">
      <h1 style="text-align: center; color: var(--amarelo);">Área Restrita</h1>
      <p class="page-intro" style="text-align: center;">
        Acesse sua Página Inicial para consultar e atualizar seus dados cadastrais,
        além de acessar conteúdos exclusivos.
      </p>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="login-form" class="form-grid">
        <div class="form-group form-group-full">
          <label for="login-cpf">CPF</label>
          <input
            type="text"
            id="login-cpf"
            name="cpf"
            placeholder="000.000.000-00"
            inputmode="numeric"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group form-group-full">
          <label for="login-senha">Senha</label>
          <input
            type="password"
            id="login-senha"
            name="senha"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="form-actions" style="margin-top: 10px;">
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Entrar
          </button>
        </div>

        <p id="login-mensagem" class="field-hint" style="text-align: center; font-weight: bold; margin-top: 10px;"></p>
      </form>

      <hr class="form-separator" />

      <div style="text-align: center;">
        <p class="field-hint">
          Esqueceu sua senha ou é seu primeiro acesso?
        </p>
        <a href="/recuperar-senha.html" class="btn btn-outline" style="width: 100%; margin-top: 10px;">
          Recuperar Senha / Primeiro Acesso
        </a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
