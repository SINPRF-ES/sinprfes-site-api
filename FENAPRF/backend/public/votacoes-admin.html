<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Administração de Votações – SINPRF-ES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/style.css" />

  <!-- Scripts Core -->
  <script src="/js/main.js" defer></script>
  <script src="/js/area-user/utils.js"></script>

  <!-- Scripts de Módulo -->
  <script src="/js/votacoes-admin.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page container">
    <section class="section-card">
      <h1 class="section-title">🗳️ Administração de Votações</h1>
      <p class="section-subtitle">
        Crie, abra, encerre votações e acompanhe resultados em tempo real.
      </p>

      <!-- CRIAR VOTAÇÃO -->
      <div class="section-box">
        <h3>Criar nova votação</h3>

        <form id="form-criar-votacao">
          <div class="field-group">
            <label>Título *</label>
            <input name="titulo" required />
          </div>

          <div class="field-group">
            <label>Descrição</label>
            <textarea name="descricao" rows="3"></textarea>
          </div>

          <div class="field-group">
            <label>Opções (uma por linha, mínimo 2)</label>
            <textarea name="opcoes" rows="4" required></textarea>
          </div>

          <button class="btn btn-primary" type="submit">
            Criar votação
          </button>
        </form>
      </div>

      <!-- LISTA -->
      <div class="section-box" style="margin-top:20px;">
        <h3>Votações</h3>
        <div id="lista-votacoes">Carregando...</div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
