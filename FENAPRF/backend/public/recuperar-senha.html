<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Recuperar Senha – FENAPRF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/main.js" defer></script>
  <script src="/js/recuperar-senha.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page container" style="max-width: 500px; margin-top: 40px;">
    <section class="card login-card">
      <h1 id="page-title" style="text-align: center; color: var(--amarelo);">Recuperar Senha</h1>
      <p id="page-intro" class="page-intro" style="text-align: center;">
        Informe seu CPF para receber um link de recuperação por e-mail.
      </p>

      <!-- FORMULÁRIO DE SOLICITAÇÃO (CPF) -->
      <form id="forgot-form" class="form-grid" style="margin-top: 20px;">
        <div class="form-group form-group-full">
          <label for="forgot-cpf">CPF</label>
          <input
            type="text"
            id="forgot-cpf"
            name="cpf"
            placeholder="000.000.000-00"
            inputmode="numeric"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-actions" style="margin-top: 20px;">
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Enviar link de recuperação
          </button>
        </div>
      </form>

      <!-- FORMULÁRIO DE REDEFINIÇÃO (TOKEN + NOVA SENHA) -->
      <form id="reset-form" class="form-grid" style="margin-top: 20px; display: none;">
        <div class="form-group form-group-full">
          <label for="senha-nova">Nova senha</label>
          <input
            type="password"
            id="senha-nova"
            name="senha_nova"
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
            required
          />
        </div>

        <div class="form-group form-group-full">
          <label for="senha-confirma">Confirme a nova senha</label>
          <input
            type="password"
            id="senha-confirma"
            name="senha_confirma"
            autocomplete="new-password"
            placeholder="Repita a nova senha"
            required
          />
        </div>

        <div class="form-actions" style="margin-top: 20px;">
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Salvar nova senha
          </button>
        </div>
      </form>

      <p id="mensagem" class="field-hint" style="text-align: center; font-weight: bold; margin-top: 15px; min-height: 1.5em;"></p>

      <hr class="form-separator" />

      <p class="field-hint" style="text-align: center;">
        Voltar para a <a href="/login.html" style="color: var(--amarelo); text-decoration: underline;">página de login</a>.
      </p>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
