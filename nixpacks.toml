[phases.setup]
aptPkgs = ["...", "libasound2", "libatk-bridge2.0-0", "libatk1.0-0", "libatspi2.0-0", "libcairo2", "libdbus-1-3", "libdrm2", "libgbm1", "libglib2.0-0", "libgtk-3-0", "libnspr4", "libnss3", "libpango-1.0-0", "libx11-6", "libx11-xcb1", "libxcb1", "libxcomposite1", "libxdamage1", "libxext6", "libxfixes3", "libxkbcommon0", "libxrandr2", "ca-certificates", "fonts-liberation"]

[phases.install]
cmds = ["npm install -g pnpm@9.15.9 --force", "pnpm install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "pnpm --filter ${FILTER:-*} build",
  "if [ -z \"$FILTER\" ] || [ \"$FILTER\" = \"*\" ] || [ \"$FILTER\" = \"@sinprfes/backend\" ]; then pnpm --filter @sinprfes/backend run build:railway; fi"
]
