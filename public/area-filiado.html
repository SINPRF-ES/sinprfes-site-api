<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Área do Filiado – SINPRF-ES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/main.js" defer></script>
  <script src="/js/area-filiado.js" defer></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="page container">
    <section class="card">
      <h1 class="section-title">
        <span class="emoji">👤</span>
        <span>Meus dados cadastrais</span>
      </h1>
      <p class="section-subtitle">
        Sempre confira se seus dados estão atualizados. Em caso de dúvida, fale com a secretaria do sindicato.
      </p>

      <div id="area-filiado-conteudo">
        Carregando seus dados...
      </div>

      <div class="form-actions" style="margin-top: 16px;">
        <button id="btn-logout" class="btn btn-outline" type="button">
          Sair da área do filiado
        </button>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
